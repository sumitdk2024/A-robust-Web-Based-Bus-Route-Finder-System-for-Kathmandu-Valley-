services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: routefinder-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: routefinder-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    